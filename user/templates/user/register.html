{% extends "park_data/base.html" %} 
{% load crispy_forms_tags %} 
{% load static%} 
{% block main %}

<div class="container-fluid text-center my-5 bg-light">
  <h1 class="display-1 fw-bold text-success">
    <img
      src="{% static 'assets/images/Saf.logo.png' %}"
      alt="Logo"
      width="80"
      height="80"
      class="me-2 rounded-circle"
    />
    African Stem Safaris
  </h1>
  <p class="lead text-muted">
    Discover the beauty and wild majesty of Africa's Big Five
  </p>
  <h3 class="mb-3">User Registration</h3>
</div>
<div class="container">
  <!-- Form Section -->
  <div class="row justify-content-center align-items-center">
    <div class="col-md-8 col-lg-6 shadow p-4 rounded bg-white">
      {% crispy form %}
    </div>
  </div>
</div>

{% endblock main %}
