{% extends "park_data/base.html"%} {% load crispy_forms_tags%} {% load static %}
{% block main %}
<div class="container-fluid text-center my-5 bg-light">
  <h1 class="display-1 fw-bold text-success">
    <img
      src="{% static 'assets/images/Saf.logo.png' %}"
      alt="Logo"
      width="80"
      height="80"
      class="me-2 rounded-circle"
    />
    African Stem Safaris
  </h1>
  <p class="lead text-muted">
    Discover the beauty and wild majesty of Africa's Big Five
  </p>
  <h3 class="mb-3">Log in</h3>
</div>

<div class="container">
  <div class="row justify-content-center align-items-center">
    <div class="col-md-6 col-lg-5 p-4 shadow border rounded bg-white">
      <!-- Crispy form rendering -->
      {% crispy form %}

      <div class="border-top pt-3 mt-4">
        <small class="text-muted">
          <strong> 📚 Need an account?</strong>
          <a
            class="mx-3 px-3 btn btn-sm btn-warning"
            href="{% url 'register' %}"
          >
            🔑 Sign Up
          </a>
        </small>
      </div>

      <div class="mt-3 text-end">
        <a class="text-decoration-none" href="{% url 'password_reset' %}">
          <strong>🚸 Forgot password?</strong>
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock main %}
